[versions]
# agp/coreKtx/androidxAnnotation/lifecycle/activityCompose/navigationCompose/
# composeBom/hilt/hiltNavigation/kotlin/ksp/room ficam presos numa versão mais
# antiga de propósito. Testado empiricamente (2026-09-07): toda a família
# androidx.activity/lifecycle/navigation/core mais nova que essa exige
# compileSdk 36+ e AGP 8.9.1+/9.1.0+ (confirmado tentando bump isolado — cada
# lib puxa a próxima transitivamente: navigation-compose 2.10 força
# lifecycle 2.11 força activity-compose 1.13 força core-ktx 1.18+, todas além
# do teto do nosso AGP 8.6.x). Ou seja, esse bloco todo só sobe junto com um
# bump de AGP para a série 9.x — e esse projeto já teve bug real de Gradle 9 +
# plugin de includeBuild perdendo accessor tipado do catálogo (ver
# build-logic). É upgrade dedicado, com bateria de build+teste completa, não
# side-effect de "habilitar lint". Alvo de referência quando isso acontecer:
# agp 9.4.0, kotlin/ksp 2.4.20, hilt 2.60.1, hiltNavigation 1.4.0,
# composeBom 2026.08.00, room 2.8.4, coreKtx 1.19.0, activityCompose 1.13.0,
# lifecycle 2.11.0, navigationCompose 2.10.0.
agp = "8.6.1"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
coreKtx = "1.13.1"
androidxAnnotation = "1.10.0"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.02"
navigationCompose = "2.8.0"
hilt = "2.52"
hiltNavigation = "1.2.0"
kotlinxSerialization = "1.8.1"
kotlinxCoroutines = "1.10.2"
room = "2.6.1"
zxing = "3.5.3"
junitJupiter = "5.14.4"
junitPlatform = "1.14.4"
mockk = "1.13.17"
turbine = "1.2.1"
coroutinesTest = "1.10.2"
espresso = "3.6.1"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"

