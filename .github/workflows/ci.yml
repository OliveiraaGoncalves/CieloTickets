name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, lint e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + lint + testes unitários
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Cobertura de testes (Kover)
        run: ./gradlew koverHtmlReport koverXmlReport

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: kover-report-${{ github.sha }}
          path: |
            build/reports/kover/html/
            build/reports/kover/report.xml
          retention-days: 30

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          # Só o debug (sufixo .dev): sem keystore.properties (gitignorado,
          # não existe no runner) o assembleRelease cai pra assinatura de
          # debug — ver aviso em app/build.gradle.kts — publicar esse
          # artefato como "release" seria enganoso.

      - name: Publicar relatórios (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  dependency-scan:
    name: Scan de dependências
    runs-on: ubuntu-latest
    # contents:write só é usado no push (dependency-submission escreve o
    # grafo via API do GitHub); no pull_request o token já vem com escopo
    # reduzido automaticamente, a action de review só lê o diff.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Publica o grafo de dependências REAL (versões resolvidas, não só o
      # que libs.versions.toml declara) pro GitHub — é o que liga o
      # Dependabot Alerts (aba Security do repo) pra esse projeto. Só no
      # push: é o estado do `main` que deve ficar monitorado continuamente.
      - name: Publicar grafo de dependências
        if: github.event_name == 'push'
        uses: gradle/actions/dependency-submission@v4

      # Compara as dependências que o PR está adicionando/mudando contra
      # vulnerabilidades já conhecidas e falha o check se achar alguma —
      # pega problema ANTES do merge, não só monitora depois.
      - name: Revisar dependências do PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  instrumented:
    name: Testes instrumentados (emulador)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runner hospedado do GitHub já tem KVM habilitado em ubuntu-latest,
      # mas a action recomenda garantir a permissão do device explicitamente.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testes instrumentados
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Publicar relatórios (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/
          retention-days: 7
